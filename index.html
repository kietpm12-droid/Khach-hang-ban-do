<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    >
    <title>Khách Hàng Bản Đồ</title>
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
</head>
<body>
<!-- ==================================================
     TRANG ĐĂNG NHẬP
================================================== -->
<div id="loginPage" class="login-page">
    <div class="login-box">
        <div class="login-logo">
            📍
        </div>
        <h1>Khách Hàng Bản Đồ</h1>
        <p class="login-subtitle">
            Đăng nhập để sử dụng
        </p>
        <input
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="username"
        >
        <input
            type="password"
            id="password"
            placeholder="Mật khẩu"
            autocomplete="current-password"
        >
        <label class="remember-row">
            <input
                type="checkbox"
                id="remember"
            >
            <span>Ghi nhớ email</span>
        </label>
        <button
            id="loginBtn"
            class="primary-btn"
        >
            Đăng nhập
        </button>
    </div>
</div>
<!-- ==================================================
     APP
================================================== -->
<div id="appPage" style="display:none;">
    <!-- ===============================
         HEADER
    ================================ -->
    <header class="app-header">
        <button
            id="menuBtn"
            class="menu-button"
            type="button"
        >
            ☰
        </button>
        <div class="header-title">
            Khách Hàng Bản Đồ
        </div>
    </header>
    <!-- ==================================================
         MENU BÊN TRÁI
    ================================================== -->
    <div
        id="menuOverlay"
        class="menu-overlay"
    ></div>
    <aside
        id="sideMenu"
        class="side-menu"
    >
        <div class="menu-header">
            <div class="menu-logo">
                📍
            </div>
            <div>
                <strong>
                    Khách Hàng Bản Đồ
                </strong>
                <div
                    id="menuUser"
                    class="menu-user"
                ></div>
            </div>
        </div>
        <div class="menu-list">
            <button
                class="menu-item"
                data-page="home"
                type="button"
            >
                🏠
                <span>Trang chủ</span>
            </button>
            <button
                class="menu-item"
                data-page="addCustomer"
                type="button"
            >
                ➕
                <span>Thêm khách hàng</span>
            </button>
            <button
                class="menu-item"
                data-page="customers"
                type="button"
            >
                👥
                <span>Danh sách khách hàng</span>
            </button>
            <button
                class="menu-item"
                data-page="mapPage"
                type="button"
            >
                🗺️
                <span>Bản đồ</span>
            </button>
            <button
                id="logoutBtn"
                class="menu-item logout-item"
                type="button"
            >
                🚪
                <span>Đăng xuất</span>
            </button>
        </div>
    </aside>
    <!-- ==================================================
         NỘI DUNG
    ================================================== -->
    <main class="app-content">
        <!-- ==================================================
             TRANG CHỦ
        ================================================== -->
        <section
            id="home"
            class="page"
        >
            <div class="welcome-card">
                <h2>
                    Xin chào 👋
                </h2>
                <p>
                    Quản lý thông tin khách hàng
                    và vị trí trên bản đồ.
                </p>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        👥
                    </div>
                    <div class="stat-number"
                         id="totalCustomers">
                        0
                    </div>
                    <div class="stat-label">
                        Khách hàng
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        📍
                    </div>
                    <div class="stat-number"
                         id="gpsCustomers">
                        0
                    </div>
                    <div class="stat-label">
                        Có GPS
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        📷
                    </div>
                    <div class="stat-number"
                         id="photoCustomers">
                        0
                    </div>
                    <div class="stat-label">
                        Có ảnh
                    </div>
                </div>
            </div>
            <button
                class="home-action"
                onclick="showPage('addCustomer')"
                type="button"
            >
                ➕ Thêm khách hàng
            </button>
            <button
                class="home-action"
                onclick="showPage('customers')"
                type="button"
            >
                👥 Xem danh sách
            </button>
        </section>
        <!-- ==================================================
             THÊM / SỬA KHÁCH HÀNG
        ================================================== -->
        <section
            id="addCustomer"
            class="page"
            style="display:none;"
        >
            <div class="page-title">
                <h2>
                    Thêm khách hàng
                </h2>
            </div>
            <div class="form-card">
                <!-- HỌ TÊN -->
                <label>
                    Họ tên khách hàng
                </label>
                <input
                    type="text"
                    id="name"
                    placeholder="Nhập họ tên"
                    autocomplete="off"
                >
                <!-- ĐỊA CHỈ -->
                <label>
                    Địa chỉ
                </label>
                <textarea
                    id="address"
                    placeholder="Nhập địa chỉ khách hàng"
                    rows="3"
                ></textarea>
                <!-- GHI CHÚ -->
                <label>
                    Ghi chú
                </label>
                <textarea
                    id="note"
                    placeholder="Nhập ghi chú"
                    rows="3"
                ></textarea>
                <!-- GPS -->
                <div class="form-section">
                    <button
                        id="gpsBtn"
                        class="secondary-btn"
                        type="button"
                    >
                        📍 Lấy vị trí GPS
                    </button>
                    <div
                        id="gpsStatus"
                        class="status-text"
                    >
                        Chưa lấy vị trí
                    </div>
                </div>
                <!-- CAMERA -->
                <div class="form-section">
                    <button
                        id="cameraBtn"
                        class="secondary-btn"
                        type="button"
                    >
                        📷 Chụp ảnh nhà KH
                    </button>
                    <!-- Camera điện thoại -->
                    <input
                        type="file"
                        id="cameraInput"
                        accept="image/*"
                        capture="environment"
                        style="display:none;"
                    >
                    <div
                        id="photoStatus"
                        class="status-text"
                    >
                        Chưa chụp ảnh
                    </div>
                    <img
                        id="photoPreview"
                        class="photo-preview"
                        style="display:none;"
                        alt="Ảnh khách hàng"
                    >
                </div>
                <!-- NÚT -->
                <div class="form-buttons">
                    <button
                        id="cancelBtn"
                        class="cancel-btn"
                        type="button"
                    >
                        Hủy
                    </button>
                    <button
                        id="saveBtn"
                        class="primary-btn"
                        type="button"
                    >
                        Lưu khách hàng
                    </button>
                </div>
            </div>
        </section>
        <!-- ==================================================
             DANH SÁCH KHÁCH HÀNG
        ================================================== -->
        <section
            id="customers"
            class="page"
            style="display:none;"
        >
            <div class="page-title">
                <h2>
                    Danh sách khách hàng
                </h2>
            </div>
            <div class="search-box">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="🔍 Tìm khách hàng..."
                    autocomplete="off"
                >
            </div>
            <div
                id="customerList"
                class="customer-list"
            >
                <div class="empty-state">
                    Đang tải dữ liệu...
                </div>
            </div>
        </section>
        <!-- ==================================================
             BẢN ĐỒ
        ================================================== -->
        <section
            id="mapPage"
            class="page"
            style="display:none;"
        >
            <div class="page-title">
                <h2>
                    🗺️ Bản đồ khách hàng
                </h2>
            </div>
            <div
                id="map"
                class="map-container"
            ></div>
        </section>
    </main>
</div>
<!-- ==================================================
     APP JS
================================================== -->
<script src="app.js"></script>
</body>
</html>
